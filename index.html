<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerPulse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Form Box -->
        <div class="form-box">
            
            <!-- Login Form -->
            <form id="loginForm" class="form-content">
                <h2>Login</h2>
                <div class="input-group">
                    <input type="text" id="loginUser" required placeholder=" ">
                    <label for="loginUser">Email or Phone Number</label>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" required placeholder=" ">
                    <label for="loginPassword">Password</label>
                </div>
                <button type="submit" class="btn">Login</button>
                <p class="switch-text">Don't have an account? <a href="#" id="showRegister">Register here</a></p>
            </form>

            <!-- Registration Form -->
            <form id="registerForm" class="form-content hidden">
                <h2>Register</h2>
                <div class="input-group">
                    <input type="text" id="regName" required placeholder=" ">
                    <label for="regName">Full Name</label>
                </div>
                <div class="input-group">
                    <input type="email" id="regEmail" required placeholder=" ">
                    <label for="regEmail">Email Address</label>
                </div>
                <div class="input-group">
                    <input type="tel" id="regMobile" required placeholder=" ">
                    <label for="regMobile">Mobile Number</label>
                </div>
                <div class="input-group">
                    <input type="password" id="regPassword" required placeholder=" ">
                    <label for="regPassword">Password</label>
                </div>
                <div class="input-group">
                    <input type="password" id="regConfirmPassword" required placeholder=" ">
                    <label for="regConfirmPassword">Confirm Password</label>
                </div>
                <button type="submit" class="btn">Register</button>
                <p class="switch-text">Already have an account? <a href="#" id="showLogin">Login here</a></p>
            </form>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
